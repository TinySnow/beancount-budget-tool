name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Check command entry points
        run: |
          beancount-budget-tool --help
          beancount-budget-report --help
          beancount-budget-review-month --help
          beancount-budget-audit --help
          beancount-budget-review-refs --help
          beancount-budget-project --help
          python -c "import curses"
